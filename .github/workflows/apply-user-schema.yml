name: Apply explicit user timestamps

on:
  push:
    branches:
      - frontend/hypogeum-shell

permissions:
  contents: write

jobs:
  patch-user-schema:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend/hypogeum-shell

      - name: Update user schema and timestamp trigger
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("hypogeum/vespasian.py")
          text = path.read_text()

          old_schema = """                created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,\n                updated_at TIMESTAMPTZ[] NOT NULL DEFAULT ARRAY[CURRENT_TIMESTAMP]::TIMESTAMPTZ[]\n"""
          new_schema = """                created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,\n                profile_updated_at TIMESTAMP WITH TIME ZONE,\n                password_changed_at TIMESTAMP WITH TIME ZONE,\n                status_changed_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,\n                last_login_at TIMESTAMP WITH TIME ZONE\n"""
          if old_schema not in text:
              raise SystemExit("Expected user schema block not found")
          text = text.replace(old_schema, new_schema, 1)

          start = text.index("def _create_update_at_trigger")
          end = text.index("def _create_instance_control_function", start)
          old_trigger = text[start:end]
          instance_marker = "    instance_trigger_function_name = f\"{instances_table}_update_timestamp\"\n"
          marker_index = old_trigger.index(instance_marker)
          instance_part = old_trigger[marker_index:]

          new_user_trigger = '''def _create_update_at_trigger(cursor: psycopg2.extensions.cursor) -> None:\n    user_table = env("POSTGRESQL_USER_TABLE")[0]\n    instances_table = env("POSTGRESQL_INSTANCES_TABLE")[0]\n\n    user_trigger_function_name = f"{user_table}_update_timestamp"\n    user_trigger_name = f"{user_table}_update_timestamp_trigger"\n\n    cursor.execute(\n        sql.SQL("""\n            CREATE OR REPLACE FUNCTION {function_name}()\n            RETURNS TRIGGER AS $$\n            BEGIN\n                IF current_setting('session.bypass_trigger', true) = 'true' THEN\n                    RETURN NEW;\n                END IF;\n\n                IF NEW.display_name IS DISTINCT FROM OLD.display_name\n                   OR NEW.avatar IS DISTINCT FROM OLD.avatar THEN\n                    NEW.profile_updated_at = CURRENT_TIMESTAMP;\n                END IF;\n\n                IF NEW.password IS DISTINCT FROM OLD.password THEN\n                    NEW.password_changed_at = CURRENT_TIMESTAMP;\n                END IF;\n\n                IF NEW.status IS DISTINCT FROM OLD.status THEN\n                    NEW.status_changed_at = CURRENT_TIMESTAMP;\n                END IF;\n\n                RETURN NEW;\n            END;\n            $$ LANGUAGE plpgsql;\n        """).format(\n            function_name=sql.Identifier(user_trigger_function_name),\n        )\n    )\n\n    cursor.execute(\n        sql.SQL("""\n            DROP TRIGGER IF EXISTS {trigger_name} ON {table_name};\n            CREATE TRIGGER {trigger_name}\n            BEFORE UPDATE ON {table_name}\n            FOR EACH ROW EXECUTE FUNCTION {function_name}();\n        """).format(\n            trigger_name=sql.Identifier(user_trigger_name),\n            table_name=sql.Identifier(user_table),\n            function_name=sql.Identifier(user_trigger_function_name),\n        )\n    )\n\n'''
          text = text[:start] + new_user_trigger + instance_part + text[end:]
          path.write_text(text)
          PY

      - name: Validate syntax
        run: python -m py_compile hypogeum/vespasian.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hypogeum/vespasian.py
          git commit -m "Replace user timestamp history with explicit fields"
          git push origin frontend/hypogeum-shell
